name: Private guard prototype tests
on:
  pull_request:
    paths:
      - 'scripts/private_guard.py'
      - 'tests/test_private_guard.py'
      - '.github/workflows/private-guard-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic unit tests (no secrets)
        run: python3 -m unittest discover -s tests -p 'test_private_guard.py' -v
