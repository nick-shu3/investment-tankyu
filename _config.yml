title: 投資探究
markdown: kramdown
collections:
  articles:
    output: true
    permalink: /articles/:name.html
  columns:
    output: true
    permalink: /columns/:name.html
defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article
  - scope:
      path: ""
      type: columns
    values:
      layout: column
exclude:
  - README.md
  - AGENTS.md
  - scripts
url: "https://nick-shu3.github.io"
baseurl: "/investment-tankyu"
