name: Research and Jekyll checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publication policy and article metadata
        run: |
          python3 scripts/validate_publication.py
          python3 scripts/validate_articles.py
      - name: Build Jekyll (no deployment)
        uses: actions/jekyll-build-pages@v1
        with:
          destination: ./_site
      - name: Check generated pages and local links
        run: python3 scripts/check_site.py
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile layouts
        run: node scripts/check_layout.cjs
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-preview
          path: qa-screenshots/
          if-no-files-found: ignore
